# ---------------------------------------------------------------------------
# Ministers and other named figures, mapped to departments.
#
# Headlines often name the minister rather than the department ("Mahmood's
# immigration shake-up"), so names score as keywords (2 points; 4 in a
# headline, enough on its own to file the story).
#
# KEEP THIS UP TO DATE: it goes stale at every reshuffle. When a minister moves,
# move their name; when they leave, delete it. The loader logs a warning once
# `as_of` is more than 180 days old as a reminder to review it.
#
# Use full names wherever a surname is ambiguous ("Lucy Powell", not "Powell",
# which would also match the US Federal Reserve chair).
# ---------------------------------------------------------------------------

