# ---------------------------------------------------------------------------
# Research departments, mirroring UK government ministerial departments
# (machinery of government as of the Burnham ministry, July 2026), plus one
# non-departmental section for Parliament and party politics.
#
# Each department has up to four term lists, scored per article:
#
#   strong   (4 points) – terms that almost certainly mean this department:
#                         its name, secretary of state title, flagship bodies.
#   keywords (2 points) – policy-area vocabulary.
#   context  (1 point)  – ambiguous words that support a match but can't make
#                         one alone (e.g. "road", "council", "AI").
#   exclude             – vetoes this department if present anywhere.
#
# Ministers' names live in people.toml and score as keywords.
#
# Matches in the headline count double. An article is filed under a
# department when it scores 4 or more (one keyword in the headline, one strong
# term anywhere, or a combination), and under further departments only if
# they score at least half as well as its best match.
#
# Term syntax
#   - Case-insensitive whole words: "prison" matches "Prison", not "imprisonment".
#   - Trailing *  matches any ending: "prison*" -> prisons, prisoner, prisoners.
#   - ALL-CAPS acronyms match case-sensitively: "SEND" won't match "send".
#   - Leading =   forces case-sensitive matching: "=Budget" matches the UK
#                 Budget but not "under budget".
# Use `python -m news_collator explain "headline"` to see how a headline scores,
# and `python -m news_collator audit` for a CSV of every live article.
# ---------------------------------------------------------------------------

# Applied to headlines only, before any department scoring: content types that
# are never policy news even when they mention a policy topic.
[global]
exclude = ["cartoon", "crossword", "quiz", "podcast", "Live event", "in pictures", "| Letters",
           "| Letter", "obituary", "horoscope", "recipe*", "puzzle*"]

[departments.home-office]
name = "Home Office"
strong = ["Home Office", "Home Secretary", "Border Force", "MI5", "National Crime Agency", "Prevent programme"]
keywords = [
  "immigration", "asylum", "small boats", "Channel crossing*", "migrant*", "visa*", "deport*",
  "removals", "returns deal", "returns agreement", "Rwanda", "net migration", "refugee*",
  "indefinite leave", "citizenship", "illegal working", "asylum hotel*", "policing", "police force*", "chief constable*", "police chief*",
  "counter-terror*", "terroris*", "extremis*", "far-right", "far right", "proscri*", "Palestine Action",
  "knife crime", "antisocial behaviour", "grooming gang*", "drugs", "county lines",
  "drug deaths", "passport*", "protest law*", "violence against women",
  "Metropolitan Police", "Met Police", "Met chief", "police merger*", "on-the-spot fine*"]
context = ["crackdown", "crime", "fraud", "e-bike*", "settlement", "police", "riot*"]

