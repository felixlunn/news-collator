# ---------------------------------------------------------------------------
# Research departments, mirroring UK government ministerial departments.
#
# For each department:
#   name     – display name
#   strong   – terms that almost certainly mean the story belongs here
#              (department name, secretary of state title, flagship bodies).
#              Each match scores STRONG_WEIGHT (see classify.py).
#   keywords – policy-area terms. Each match scores 1.
#   exclude  – terms that, if present, veto the department for that article
#              (useful to stop e.g. "court" in sports stories). Optional.
#
# Matching is case-insensitive and on whole words, except for terms written
# entirely in capitals (acronyms such as "SEND", "AI", "PIP"), which are
# matched case-sensitively so they don't catch ordinary words; a trailing * matches any
# word ending, so "prison*" matches prison, prisons, prisoner, prisoners.
# Matches in the headline count double. An article can belong to several
# departments.
#
# Ministers' names are deliberately left out — they change at every reshuffle.
# Add them locally if you want them, but remember to maintain them.
# ---------------------------------------------------------------------------

[departments.home-office]
name = "Home Office"
strong = ["Home Office", "Home Secretary", "Border Force", "MI5", "National Crime Agency"]
keywords = [
  "immigration", "asylum", "small boats", "Channel crossing*", "migrant*", "visa*",
  "deport*", "police", "policing", "chief constable", "counter-terror*", "terroris*",
  "knife crime", "antisocial behaviour", "grooming gang*", "passport*", "net migration",
  "refugee*", "hotel* for asylum", "extremis*", "protest law*",
]

[departments.moj]
name = "Ministry of Justice"
strong = ["Ministry of Justice", "Justice Secretary", "Lord Chancellor", "HM Prison", "Probation Service", "Parole Board"]
keywords = [
  "prison*", "jail*", "sentencing", "sentence*", "court backlog*", "Crown Court",
  "magistrate*", "jury", "juries", "legal aid", "probation", "early release",
  "reoffend*", "judge*", "judiciary", "tribunal*", "victims' commissioner", "barrister*",
]
exclude = ["tennis", "basketball", "food court"]

