# ---------------------------------------------------------------------------
# Team tags: topics that cut across departments. Each tag gets its own page on
# the website and can be combined with departments in a channel.
#
# A tag collects:
#   1. articles from our outlet feeds whose headline or summary contains any
#      of its terms (and none of its exclude terms), and
#   2. if `search = true` (the default), results of a media search run on
#      every rebuild, limited to UK outlets (see [search] below). These find
#      coverage from outlets we don't follow directly.
#
# Term syntax is the same as departments.toml: case-insensitive whole words,
# a trailing * for any ending, ALL-CAPS acronyms and =terms are case-sensitive.
# The media search ignores * and case, and skips terms under 3 characters.
#
# Media searches keep results from UK outlets only: any .uk domain, plus the
# UK outlets on other domains listed in news_collator/tags.py (UK_OUTLETS).
# Add more with `uk_domains` under [search].
#
# Readers can also create personal tags on the website's Channels page; those
# live in their browser and search everything the site has collected.
#
# Run `python -m news_collator tags` to check the search each tag will run.
# ---------------------------------------------------------------------------

[search]
enabled = true
country = "UK"   # GDELT source-country code; UK = United Kingdom
# Tried in order until one answers. Google News (UK edition) is first because
# GDELT, an open news index, refused most requests from GitHub's shared
# servers in testing (November 2026). Remove either to stop using it.
providers = ["google_news", "gdelt"]
uk_domains = []  # extra UK outlet domains to accept, e.g. ["example-outlet.com"]
# Address of the search Worker (worker/), which lets personal tags on the
# Channels page search UK outlets live. Leave empty to search collected
# coverage only. Example: "https://despatch-search.<your-subdomain>.workers.dev"
live_search_url = ""

# No team tags are defined yet. To add one, copy this template, remove the
# leading "# " from each line and fill it in. The slug after "tags." becomes the
# page address (tags/<slug>.html).
#
# [tags.example-slug]
# name = "Display name"
# terms = ["first term", "second term", "acronym", "word*"]
# exclude = ["term that should rule a story out"]   # optional
# search = true                                     # optional; false skips the media search
