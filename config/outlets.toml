# ---------------------------------------------------------------------------

[[outlet]]
name = "BBC Scotland"
enabled = true
feeds = [
  "https://feeds.bbci.co.uk/news/scotland/scotland_politics/rss.xml",
  "https://feeds.bbci.co.uk/news/scotland/rss.xml",
]

[[outlet]]
name = "BBC Wales"
enabled = true
feeds = [
  "https://feeds.bbci.co.uk/news/wales/wales_politics/rss.xml",
  "https://feeds.bbci.co.uk/news/wales/rss.xml",
]

[[outlet]]
name = "The Herald"
enabled = true
feeds = [
  "https://www.heraldscotland.com/politics/rss/",
  "https://www.heraldscotland.com/news/rss/",
]

[[outlet]]
name = "Belfast Telegraph"
enabled = true
feeds = [
  "https://www.belfasttelegraph.co.uk/news/politics/rss/",
  "https://www.belfasttelegraph.co.uk/rss",
]

# The Times is deliberately not included: it has no public feed, and taking its
# headlines from Google News lacks the publisher's permission that a feed
# implies. It is also excluded from tag and live searches (uk_outlets.json).

# ITV News and The Spectator publish no RSS feeds (every candidate address
# returned 404 in November 2026). Tag and live searches can still find them.

# ---------------------------------------------------------------------------
# General and world news from the same UK outlets. These widen what tags and
# channels can search beyond politics sections. Their articles are classified
# like any other, so they also feed departments where relevant.
# ---------------------------------------------------------------------------

[[outlet]]
name = "BBC News"
enabled = true
feeds = [
  "https://feeds.bbci.co.uk/news/rss.xml",
  "https://feeds.bbci.co.uk/news/world/rss.xml",
]

[[outlet]]
name = "The Guardian"
enabled = true
feeds = [
  "https://www.theguardian.com/uk/rss",
  "https://www.theguardian.com/world/rss",
]

[[outlet]]
name = "Sky News"
enabled = true
feeds = [
  "https://feeds.skynews.com/feeds/rss/home.xml",
  "https://feeds.skynews.com/feeds/rss/world.xml",
]

[[outlet]]
name = "The Independent"
enabled = true
feeds = [
  "https://www.independent.co.uk/news/world/rss",
]
