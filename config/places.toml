# ---------------------------------------------------------------------------
# Where a story happens.
#
# Rule: if a headline names a place outside the UK, and neither the headline
# nor the summary places the story in the UK, the story is filed under the
# `department` below (the Foreign Office) instead of any domestic department.
# Stories that name foreign places but are anchored in the UK ("UK and France
# sign returns deal", "London summit on Ukraine") are classified as normal.
#
# Only headlines are checked for foreign places, so a UK story isn't moved
# just because its summary mentions another country.
#
# Nationality words (British, Briton) are deliberately not UK anchors: "Briton
# killed in Krakow shooting" happens abroad and belongs with the Foreign Office.
# Every domestic department's `strong` terms (e.g. "Home Office", "Health
# Secretary") also count as UK anchors automatically.
# Words that are also names or ordinary English are case-sensitive (=Turkey,
# =Polish, =Guinea) or left out (Jordan, Chad, European). Continents match
# only as places ("Asia", not "Asian"), since "Asian" and "African" often
# describe people in the UK.
# Term syntax as in departments.toml.
# ---------------------------------------------------------------------------

