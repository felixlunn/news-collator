# Builds the news digest website and publishes it to GitHub Pages.
#
# Runs three times each weekday and can be triggered by hand from the
# Actions tab ("Run workflow"). Times are UTC; minutes are offset from :00
# because GitHub delays scheduled jobs at the top of the hour.
#
# One-off setup: repo Settings → Pages → Source: "GitHub Actions".
name: Publish digest site

on:
  schedule:
    - cron: "47 5,11,16 * * 1-5"   # ~06:00, 12:00, 17:00 UTC, Mon–Fri
  workflow_dispatch:

# Required for the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover tests

      # -v logs any feed that fails, so broken URLs show up in the run log.
      - name: Fetch and classify articles
        run: python -m news_collator -v fetch

      - name: Build website
        run: python -m news_collator site --hours 24 --out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
