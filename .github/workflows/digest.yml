# Builds the news digest website and publishes it to GitHub Pages.
#
# Runs three times each weekday and can be triggered by hand from the
# Actions tab ("Run workflow"). Times are UTC; minutes are offset from :00
# because GitHub delays scheduled jobs at the top of the hour.
#
# One-off setup: repo Settings → Pages → Source: "GitHub Actions".
name: Publish digest site

on:
  schedule:
    - cron: "47 5,11,16 * * 1-5"   # ~06:00, 12:00, 17:00 UTC, Mon–Fri
  workflow_dispatch:

# Required for the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover tests

      # Keep the article database between runs, so articles that have dropped
      # off a feed stay on the site for the full 72-hour window. Each run saves
      # a new cache entry and restores the most recent one.
      - name: Restore article database
        uses: actions/cache@v4
        with:
          path: data/news.sqlite3
          key: news-db-${{ github.run_id }}
          restore-keys: news-db-

      # -v logs any feed that fails, so broken URLs show up in the run log.
      - name: Fetch and classify articles
        run: python -m news_collator -v fetch --prune-days 14

      - name: Build website
        run: python -m news_collator site --hours 72 --out site

      # Classification report for tuning keywords: download it from the run's
      # summary page under "Artifacts". Kept for 7 days.
      - name: Write classification audit
        run: python -m news_collator audit --out audit/audit.csv

      - uses: actions/upload-artifact@v4
        with:
          name: classification-audit
          path: audit/audit.csv
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
