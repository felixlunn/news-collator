# Builds the news digest website and publishes it to GitHub Pages.
#
# Runs every 30 minutes from 06:00 to 18:00 UK time, Monday to Friday, and can
# be triggered by hand from the Actions tab ("Run workflow").
#
# GitHub schedules in UTC only, so the cron below covers both GMT and BST
# (05:00-18:59 UTC) and the `gate` job skips runs outside 06:00-18:00 UK time.
# Minutes are :02 and :32 because GitHub delays jobs scheduled exactly on the hour.
#
# One-off setup: repo Settings → Pages → Source: "GitHub Actions".
name: Publish digest site

on:
  schedule:
    - cron: "2,32 5-18 * * 1-5"
  workflow_dispatch:

# Required for the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; a new run waits for the current one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Decides whether this run is inside UK working hours, and whether it's the
  # first run of the day (which also writes the classification audit).
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.when.outputs.go }}
      audit: ${{ steps.when.outputs.audit }}
    steps:
      - id: when
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Europe/London"))
          minutes = now.hour * 60 + now.minute
          # 06:00 to 18:00, with 20 minutes' grace for GitHub's scheduling delays.
          in_hours = now.weekday() < 5 and 6 * 60 <= minutes <= 18 * 60 + 20
          manual = os.environ["MANUAL"] == "true"
          print(f"go={'true' if manual or in_hours else 'false'}")
          print(f"audit={'true' if manual or (in_hours and minutes < 6 * 60 + 30) else 'false'}")
          PY
          cat "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover tests

      # Keep the article database between runs, so articles that have dropped
      # off a feed stay on the site for the full 72-hour window. Each run saves
      # a new cache entry and restores the most recent one.
      - name: Restore article database
        uses: actions/cache@v4
        with:
          path: data/news.sqlite3
          key: news-db-${{ github.run_id }}
          restore-keys: news-db-

      # -v logs any feed that fails, so broken URLs show up in the run log.
      - name: Fetch and classify articles
        run: python -m news_collator -v fetch --prune-days 14

      - name: Build website
        run: python -m news_collator site --hours 72 --out site

      # Classification report for tuning keywords: download it from the run's
      # summary page under "Artifacts". Kept for 7 days. Written once a day
      # (and on manual runs), since it fetches every feed again.
      - name: Write classification audit
        if: needs.gate.outputs.audit == 'true'
        run: python -m news_collator audit --out audit/audit.csv

      - if: needs.gate.outputs.audit == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: classification-audit
          path: audit/audit.csv
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
