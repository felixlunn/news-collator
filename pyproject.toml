[project]
name = "news-collator"
version = "0.1.0"
description = "Collate UK news coverage into government-department research digests"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
news-collator = "news_collator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["news_collator"]
